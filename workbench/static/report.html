<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晚笺 · 分群故事报告</title>
<style>
:root{--bg:#f5f3ec;--paper:#fffef9;--ink:#223d34;--sub:#768176;--line:#dce1d5;--green:#285c46;--gold:#b17b46}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 14px}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}button[aria-pressed=true],button.active{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.45;cursor:default}header{border-bottom:1px solid var(--line);padding:26px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font:30px 'STZhongsong','SimSun',serif;letter-spacing:5px}small,.muted{color:var(--sub);font-size:12px}.wrap{max-width:1250px;margin:auto;padding:24px 32px 64px}.masthead{display:flex;gap:20px;align-items:center;justify-content:space-between;margin:8px 0 26px}h1{font:36px/1.5 'STZhongsong','SimSun',serif;margin:8px 0}h2{font:24px/1.6 'STZhongsong','SimSun',serif;margin:10px 0 18px}h3{font-size:17px;line-height:1.6;margin:8px 0}p{margin:8px 0;overflow-wrap:anywhere}.stats{display:flex;gap:28px;text-align:center;flex-shrink:0}.stats strong{font:32px Georgia;display:block}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:25px}.nav button{border-radius:24px}.lead{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--paper);border:1px solid var(--line);padding:22px 24px;border-radius:12px;min-width:0;margin-bottom:14px}.card p{white-space:pre-wrap}.tag{font-size:11px;padding:3px 7px;border-radius:4px;background:#edf1e6;display:inline-block;margin-right:7px}.warn{background:#fbf0dd;border-left:3px solid var(--gold);padding:12px 16px;font-size:13px;margin:14px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px;align-items:center}input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:220px;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.chat{display:flex;flex-direction:column;text-align:left;width:100%;min-height:170px;padding:20px}.chat strong{font-size:16px;overflow-wrap:anywhere}.chat p{font-size:13px;color:var(--sub);margin:10px 0;flex:1}.chat small{margin-top:auto}.story{font-size:17px;line-height:2;white-space:pre-wrap}.storybox{border-left:4px solid var(--green);padding:22px 26px;background:var(--paper);border-radius:4px 12px 12px 4px;margin:20px 0}.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.topic-grid .card{padding:20px}.num{font:24px Georgia;color:#b2beaa}.refs{font-size:12px;padding:5px 9px;color:var(--green);background:#eef3e9;border:0;margin-top:10px}.pager{display:flex;align-items:center;justify-content:center;gap:15px;margin:24px 0}.itemtitle{font-size:16px;font-weight:bold}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.compact{padding:18px 22px}.summary-link{border:0;background:transparent;padding:0;color:var(--green);text-align:left}.hidden{display:none!important}.empty{padding:40px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:12px}.pill{border-radius:20px;font-size:12px}.foot{border-top:1px solid var(--line);padding-top:20px;color:var(--sub);font-size:12px;margin-top:35px}dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);width:min(850px,94vw);max-height:85vh;padding:26px;color:var(--ink)}dialog::backdrop{background:#152d2455}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 'Microsoft YaHei';margin:10px 0}.evidence{padding:16px 0;border-bottom:1px solid var(--line)}ul{padding-left:22px}li{margin:8px 0}#crumb{margin:0 0 14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{font-size:12px}noscript{display:block;padding:30px}.analysis-note{font-size:12px;color:var(--gold)}@media(max-width:800px){.grid,.topic-grid{grid-template-columns:1fr 1fr}.wrap{padding:20px}.masthead{display:block}.stats{justify-content:flex-start;text-align:left;margin:20px 0}.lead{grid-template-columns:1fr}h1{font-size:30px}header{padding:20px}.row{flex-wrap:wrap}}@media(max-width:520px){.grid,.topic-grid{grid-template-columns:1fr}.chat{min-height:135px}.card{padding:18px}.nav{gap:6px}.nav button{font-size:13px;padding:7px 10px}.masthead p{font-size:13px}.stats{gap:22px}.brand{font-size:26px}}@media print{.nav,.toolbar,.pager,button,dialog{display:none}.wrap{max-width:none}.card{break-inside:avoid}}
.embedded header,.embedded .masthead{display:none}.embedded .wrap{padding:16px 20px 30px}.embedded .nav{margin-top:0;border-top:0;padding-top:0}
</style></head><body><header><div class="brand">晚笺 <small>群聊故事与我的事项</small></div><small>本地报告 · 原文按需查看</small></header>
<main class="wrap"><div class="masthead"><div><small id="period"></small><h1>先看重点，再走进每个群。</h1><p class="muted">读懂今天发生的事，也别漏掉需要你回应的人。</p></div><div class="stats"><div><strong id="groupN"></strong><small>个群</small></div><div><strong id="mineN"></strong><small>项与我相关</small></div><div><strong id="possibleN"></strong><small>项待核实</small></div></div></div>
<nav class="nav" aria-label="报告分区"><button data-view="overview" class="active">今日重点</button><button data-view="chats">群聊故事</button><button data-view="personal">与我相关</button><button data-view="possible">可能需要回应</button><button data-view="coverage">数据范围</button></nav><div id="content" aria-live="polite"></div><div class="foot">按原文整理，不虚构故事。待回复属于推断，不等于微信未读。PNG 与 Markdown 为重点版；此网页保留分群详情和必要依据。</div></main>
<dialog id="evidenceDialog"><div class="row"><h2>原文依据</h2><button id="closeEvidence">关闭</button></div><div id="evidenceContent"></div></dialog>
<noscript>请使用支持 JavaScript 的浏览器，或阅读同目录 summary.md。报告不依赖网络资源。</noscript>

<script>
if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embedded');
const index=JSON.parse(document.getElementById('report-index').textContent),cache=new Map(),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='overview',pageNo=0,query='',category='all',chatKey=null;const PAGE=12;
function chat(key){if(!cache.has(key)){cache.set(key,JSON.parse($(key).textContent));if(cache.size>8)cache.delete(cache.keys().next().value)}return cache.get(key)}
function refs(key,ids){return ids?.length?`<button class="refs" data-evidence="${esc(key)}" data-ids="${esc(ids.join(','))}">查看依据 · ${ids.length} 条</button>`:''}
function itemCard(i){return `<article class="card compact"><small>${esc(i.chat_name)} · ${esc(i.sender)}${i.historical?' · 历史未完成':''}</small><p class="itemtitle">${esc(i.title)}</p><span class="tag">${esc(i.relation_label)}</span>${i.deadline&&i.deadline!=='未明确'?`<span class="tag">${esc(i.deadline)}</span>`:''}${i.status==='snoozed'?'<span class="tag">稍后处理</span>':''}<p class="muted">${esc(i.reason)}</p>${i.suggested_status==='completed'?'<p class="analysis-note">发现可能完成的证据，待你确认。</p>':''}<div class="row">${refs(i.chat_key,i.evidence_ids)}<button class="summary-link" data-chat="${esc(i.chat_key)}">查看会话 →</button></div></article>`}
function pager(total){const pages=Math.ceil(total/PAGE);return pages>1?`<div class="pager"><button data-page="${pageNo-1}" ${pageNo===0?'disabled':''}>上一页</button><small>${pageNo+1} / ${pages} · 共 ${total} 项</small><button data-page="${pageNo+1}" ${pageNo+1>=pages?'disabled':''}>下一页</button></div>`:''}
function statusNote(c){return c.story_status==='partial'?'<p class="warn">部分消息未完成分析，这个故事可能不完整。</p>':c.story_status==='legacy'?'<p class="warn">这是旧版分段摘要的节选。请在工作台点击“重新整理已读记录”，生成合并后的故事线。</p>':c.story_status==='local'?'<p class="warn">尚未生成 AI 故事，本页仅展示已识别的事项。</p>':''}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});let body='';
if(view==='overview'){body=`<div class="lead"><section><div class="row"><h2>先处理这些事</h2><button data-view="personal">全部 ${index.personal.length} 项 →</button></div>${(index.focus||index.personal).slice(0,5).map(itemCard).join('')||'<div class="empty">未识别到明确属于你的未处理事项。可以再看“可能需要回应”。</div>'}</section><section><div class="row"><h2>群里发生了什么</h2><button data-view="chats">按群浏览 →</button></div>${index.highlights.map(h=>`<article class="card"><h3><button class="summary-link" data-chat="${esc(h.key)}">${esc(h.name)} →</button></h3><p>${esc(h.text)}</p></article>`).join('')||'<div class="empty">暂无故事摘要。请运行 AI 整理。</div>'}<p class="muted">另有 ${index.possible.length} 项仅可能相关的内容，单独放在“可能需要回应”，不混入明确事项。</p></section></div>`}
else if(view==='chats'){const filtered=index.chats.filter(c=>(category==='all'||(category==='group'?c.is_group:!c.is_group))&&(!query||c.name.toLowerCase().includes(query.toLowerCase())));body=`<h2>选择一个会话，看看发生了什么</h2><div class="toolbar"><input id="chatSearch" aria-label="搜索群聊或联系人" placeholder="搜索群聊或联系人" value="${esc(query)}"><div class="chips">${[['all','全部'],['group','群聊'],['private','私聊']].map(([v,l])=>`<button data-category="${v}" class="${v===category?'active':''}">${l}</button>`).join('')}</div></div><div class="grid">${filtered.slice(pageNo*PAGE,(pageNo+1)*PAGE).map(c=>`<button class="chat" data-chat="${c.key}"><strong>${esc(c.name)}</strong><p>${esc(c.teaser)}</p><small>${c.message_count} 条消息 · ${c.personal_count} 项与我相关 · ${c.topic_count} 个主题</small></button>`).join('')}</div>${filtered.length?'':'<div class="empty">没有匹配的会话。</div>'}${pager(filtered.length)}`}
else if(view==='personal'||view==='possible'){const base=view==='personal'?index.personal:index.possible;const filtered=base.filter(i=>(category==='all'||i.relation===category)&&(!query||(i.chat_name+' '+i.title+' '+i.sender).toLowerCase().includes(query.toLowerCase())));const filters=view==='personal'?[['all','全部'],['private','私聊'],['mention','群里 @我'],['quote','引用了我'],['commitment','我的承诺'],['context','上下文相关']]:[['all','全部'],['possible_quote','疑似引用我'],['possible','其他候选']];body=`<h2>${view==='personal'?'需要我关心的事':'可能需要回应 · 先核实'}</h2><p class="muted">${view==='personal'?'包含私聊、群内 @你、引用你以及有上下文依据的事项。':'未能确认指向你的群内请求与疑似引用，避免把别人的任务当成你的。'}</p><div class="toolbar"><input id="chatSearch" aria-label="搜索事项或联系人" placeholder="搜索事项或联系人" value="${esc(query)}"><div class="chips">${filters.map(([v,l])=>`<button data-category="${v}" class="${category===v?'active':''}">${l}</button>`).join('')}</div></div>${filtered.slice(pageNo*PAGE,(pageNo+1)*PAGE).map(itemCard).join('')||'<div class="empty">当前筛选没有事项。</div>'}${pager(filtered.length)}`}
else if(view==='detail'){const c=chat(chatKey);const mine=c.items.filter(i=>i.personal),other=c.items.filter(i=>!i.personal);const shown=category==='possible'?other:mine;body=`<button id="crumb" data-view="chats">← 返回会话列表</button><div class="row"><div><small>${c.is_group?'群聊':'私聊'} · ${c.message_count} 条消息</small><h2>${esc(c.name)}</h2></div><span class="tag">${c.personal_count} 项与我相关</span></div>${statusNote(c)}<div class="storybox"><small>这一段时间，事情是这样发生的</small><p class="story">${esc(c.story)}</p>${refs(chatKey,c.evidence_ids)}</div><h2>主要话题</h2><div class="topic-grid">${c.topics.map((t,i)=>`<article class="card"><span class="num">0${i+1}</span><h3>${esc(t.title)}</h3><p>${esc(t.story)}</p>${refs(chatKey,t.evidence_ids)}</article>`).join('')||'<p class="muted">暂无独立话题摘要。</p>'}</div><h2>结论与未决问题</h2>${c.conclusions.map(x=>`<article class="card compact"><p>${esc(x.text)}</p>${refs(chatKey,x.evidence_ids)}</article>`).join('')||'<p class="muted">未提取到明确结论。</p>'}<h2>本会话的待办与回应</h2><div class="chips"><button data-category="all" class="${category!=='possible'?'active':''}">与我相关 ${mine.length}</button><button data-category="possible" class="${category==='possible'?'active':''}">可能相关 ${other.length}</button></div><div style="margin-top:15px">${shown.slice(pageNo*PAGE,(pageNo+1)*PAGE).map(itemCard).join('')||'<p class="muted">当前分类没有待处理事项。</p>'}</div>${pager(shown.length)}`}
else {body=`<h2>数据范围与分析提示</h2><article class="card"><p>${esc(index.meta.start)} 至 ${esc(index.meta.end_exclusive)}（不含结束）</p><p>${esc(index.meta.coverage_note)}</p><p>模式：${esc({ai:'AI 语义整理',mixed:'部分 AI + 本地筛查',local:'本地筛查'}[index.analysis.mode]||index.analysis.mode)}</p><p>未知发送者 ${index.meta.unknown_senders||0} 条；解析失败 ${index.meta.parse_errors?.length||0} 条。</p><p>报告只保留被引用的原文节选，点击后才显示；没有嵌入历次全部聊天记录。更多原文可在工作台选择“附带完整原文”导出。</p></article>${(index.analysis.warnings||[]).slice(0,20).map(w=>`<p class="warn">${esc(w)}</p>`).join('')}${(index.analysis.warnings||[]).length>20?'<p>其余分析提示见 report-data.json。</p>':''}`}
$('content').innerHTML=body;const input=$('chatSearch');if(input)input.oninput=()=>{query=input.value;const start=input.selectionStart;pageNo=0;render();$('chatSearch').focus();$('chatSearch').setSelectionRange(start,start)};
}
function navigate(next){view=next;pageNo=0;query='';category='all';render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.collect){parent.postMessage({type:'favorite-message',id:b.dataset.collect},location.origin);b.textContent='已请求收藏';}else if(b.dataset.view){navigate(b.dataset.view)}else if(b.dataset.chat){chatKey=b.dataset.chat;navigate('detail')}else if(b.dataset.category){category=b.dataset.category;pageNo=0;render()}else if(b.dataset.page!==undefined){pageNo=Number(b.dataset.page);render();$('content').scrollIntoView()}else if(b.dataset.evidence){const c=chat(b.dataset.evidence),ids=b.dataset.ids.split(',');$('evidenceContent').innerHTML=ids.map(id=>c.evidence[id]).filter(Boolean).map(m=>`<div class="evidence"><small>${esc(m.time)} · ${esc(m.sender)}</small><pre>${esc(m.content)}</pre>${m.excerpt?'<small>长消息节选；完整内容见附带原文导出。</small>':''}${document.body.classList.contains('embedded')&&parent!==window?`<button data-collect="${esc(m.id)}">☆ 收藏</button><br>`:''}<small>来源：${esc(m.source_db)} / ${esc(m.local_id)}</small></div>`).join('')||'<p>此证据未包含在当前报告中，请回到工作台核查。</p>';$('evidenceDialog').showModal()}});
$('closeEvidence').onclick=()=>$('evidenceDialog').close();$('period').textContent=index.meta.start.slice(0,16).replace('T',' ')+' — '+index.meta.end_exclusive.slice(0,16).replace('T',' ');$('groupN').textContent=index.stats.groups;$('mineN').textContent=index.personal.length;$('possibleN').textContent=index.possible.length;render();
</script></body></html>
